name: 'Release AIO Build'

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-aio:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch_label: x86_64
            build_arch: amd64
            cross_arch: ''
          - arch_label: aarch64
            build_arch: amd64
            cross_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: '0'

      - name: Login to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull build image
        run: docker pull ghcr.io/${{ github.repository }}/build-alpine-x86_64:latest

      - name: Run build
        run: |
          mkdir -p ${{ runner.temp }}/artifacts
          chmod 777 ${{ runner.temp }}
          docker run --rm \
            --mount type=bind,source=${{ github.workspace }},target=/workspace,readonly \
            --mount type=bind,source=${{ runner.temp }},target=/tmp-runner \
            --mount type=tmpfs,target=/local \
            --mount type=tmpfs,target=/artifacts \
            --mount type=tmpfs,target=/ccache \
            --mount type=tmpfs,target=/shared-ccache \
            --env BUILD_TYPE=clang-relsize-lto-notest-ninja-static \
            --env BUILD_ARCH=${{ matrix.build_arch }} \
            --env BUILD_DIST=alpine \
            --env CROSS_ARCH=${{ matrix.cross_arch }} \
            --env GITHUB_WORKSPACE=/workspace \
            --env GITHUB_REF_NAME=${{ matrix.build_arch }}-alpine-${{ matrix.cross_arch }} \
            --env GITHUB_REF_TYPE=tag \
            --env GITHUB_RUN_ID=${{ github.run_id }} \
            --env GITHUB_RUN_NUMBER=${{ github.run_number }} \
            --env GITHUB_RUN_ATTEMPT=${{ github.run_attempt }} \
            ghcr.io/${{ github.repository }}/build-alpine-x86_64:latest

      - name: Rename artifacts
        run: |
          sudo chmod -R 777 ${{ runner.temp }}/artifacts
          cd ${{ runner.temp }}/artifacts
          for f in dwarfs-universal-*; do
            [ -f "$f" ] && mv "$f" "dwarfs-universal-${{ matrix.arch_label }}"
          done
          rm -f dwarfs-fuse-extract-* *.tar.zst

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch_label }}
          path: ${{ runner.temp }}/artifacts/dwarfs-*

  release:
    needs: build-aio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate release tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="continuous-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=Continuous ${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Delete existing release if present
        run: gh release delete "${{ steps.tag.outputs.tag }}" --cleanup-tag --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.name }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
