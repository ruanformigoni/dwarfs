name: 'Release AIO Build'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  build-aio:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch_label: x86_64
            build_arch: amd64
            cross_arch: ''
          - arch_label: aarch64
            build_arch: amd64
            cross_arch: aarch64
          - arch_label: armv7l
            build_arch: amd64
            cross_arch: arm
          - arch_label: i686
            build_arch: amd64
            cross_arch: i386
          - arch_label: riscv64
            build_arch: amd64
            cross_arch: riscv64
          - arch_label: ppc64le
            build_arch: amd64
            cross_arch: ppc64le
          - arch_label: s390x
            build_arch: amd64
            cross_arch: s390x

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: '0'

      - name: Validate tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Validate tag matches git describe
          GIT_DESC="$(git describe --tags --match 'v*' --exact-match)"
          if [[ "${TAG}" != "${GIT_DESC}" ]]; then
            echo "ERROR: Tag '${TAG}' does not match git describe '${GIT_DESC}'" >&2
            exit 1
          fi
          # Validate tagged commit is HEAD of main
          TAGGED_SHA="$(git rev-list -n 1 "${TAG}")"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "${TAGGED_SHA}" != "${MAIN_SHA}" ]]; then
            echo "ERROR: Tag '${TAG}' (${TAGGED_SHA}) is not at HEAD of main (${MAIN_SHA})" >&2
            exit 1
          fi
          echo "Tag ${TAG} validated"

      - name: Login to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull build image
        run: docker pull ghcr.io/${{ github.repository }}/build-alpine-x86_64:latest

      - name: Run build
        run: |
          mkdir -p ${{ runner.temp }}/artifacts
          chmod 777 ${{ runner.temp }}
          docker run --rm \
            --mount type=bind,source=${{ github.workspace }},target=/workspace,readonly \
            --mount type=bind,source=${{ runner.temp }},target=/tmp-runner \
            --mount type=tmpfs,target=/local \
            --mount type=tmpfs,target=/artifacts \
            --mount type=tmpfs,target=/ccache \
            --mount type=tmpfs,target=/shared-ccache \
            --env BUILD_TYPE=clang-relsize-lto-notest-ninja-static \
            --env BUILD_ARCH=${{ matrix.build_arch }} \
            --env BUILD_DIST=alpine \
            --env CROSS_ARCH=${{ matrix.cross_arch }} \
            --env GITHUB_WORKSPACE=/workspace \
            --env GITHUB_REF_NAME=${{ matrix.build_arch }}-alpine-${{ matrix.cross_arch }} \
            --env GITHUB_REF_TYPE=tag \
            --env GITHUB_RUN_ID=${{ github.run_id }} \
            --env GITHUB_RUN_NUMBER=${{ github.run_number }} \
            --env GITHUB_RUN_ATTEMPT=${{ github.run_attempt }} \
            ghcr.io/${{ github.repository }}/build-alpine-x86_64:latest

      - name: Rename artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          sudo chmod -R 777 ${{ runner.temp }}/artifacts
          cd ${{ runner.temp }}/artifacts
          # Keep only dwarfs-universal, rename to upstream pattern
          for f in dwarfs-universal-*; do
            [ -f "$f" ] && mv "$f" "dwarfs-universal-${VERSION}-Linux-${{ matrix.arch_label }}"
          done
          rm -f dwarfs-fuse-extract-* *.tar.zst

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch_label }}
          path: ${{ runner.temp }}/artifacts/dwarfs-*

  release:
    needs: build-aio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Commit: ${GITHUB_SHA}" \
            artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
